<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Errors — Vyom Engine</title>
    <style>
      :root {
        --canopy: #16a34a;
        --canopy-bright: #22c55e;
        --canopy-deep: #166534;
        --danger: #dc2626;
        --danger-bg: #fef2f2;
        --warning: #b45309;
        --warning-bg: #fffbeb;
        --radius-sm: 8px;
        --radius: 14px;
        --radius-lg: 18px;
        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 16px;
        --sp-5: 20px;
        --sp-6: 28px;
        --bg-deep: #f4f7f2;
        --bg-panel: #ffffff;
        --bg-raised: #f7faf5;
        --line: #e6ebe2;
        --text-primary: #16241a;
        --text-muted: #5c6b60;
        --text-dim: #8b9a8f;
        --shadow-sm: 0 2px 10px rgba(30, 50, 30, 0.06);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        background: var(--bg-deep);
        color: var(--text-primary);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--sp-4) var(--sp-6);
        background: var(--bg-panel);
        border-bottom: 1px solid var(--line);
        box-shadow: var(--shadow-sm);
      }
      header h1 {
        font-size: 18px;
        margin: 0;
      }
      header .badge {
        color: var(--text-dim);
        font-size: 13px;
        margin-left: var(--sp-2);
      }
      #unresolvedPill {
        background: var(--danger-bg);
        color: var(--danger);
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 13px;
        font-weight: 600;
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: var(--sp-6);
      }

      .toolbar {
        display: flex;
        gap: var(--sp-3);
        align-items: center;
        margin-bottom: var(--sp-5);
        flex-wrap: wrap;
      }
      select,
      button.filter-btn {
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        background: var(--bg-panel);
        color: var(--text-primary);
        font-size: 13px;
        cursor: pointer;
      }
      button.filter-btn.active {
        background: var(--canopy);
        color: white;
        border-color: var(--canopy);
      }
      #refreshBtn {
        margin-left: auto;
      }

      .error-card {
        background: var(--bg-panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: var(--sp-4);
        margin-bottom: var(--sp-3);
        box-shadow: var(--shadow-sm);
      }
      .error-card.resolved {
        opacity: 0.55;
      }
      .error-top {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        flex-wrap: wrap;
      }
      .source-tag {
        font-size: 12px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--bg-raised);
        color: var(--text-muted);
        border: 1px solid var(--line);
      }
      .platform-tag {
        font-size: 12px;
        padding: 3px 9px;
        border-radius: 999px;
        background: #eff6ff;
        color: #1d4ed8;
      }
      .level-warning {
        background: var(--warning-bg);
        color: var(--warning);
      }
      .level-error {
        background: var(--danger-bg);
        color: var(--danger);
      }
      .time {
        font-size: 12px;
        color: var(--text-dim);
        margin-left: auto;
      }
      .message {
        margin: var(--sp-2) 0;
        font-size: 14px;
      }
      .context {
        font-size: 12px;
        color: var(--text-muted);
        font-family: ui-monospace, monospace;
        background: var(--bg-raised);
        border-radius: var(--radius-sm);
        padding: var(--sp-2) var(--sp-3);
        margin-bottom: var(--sp-2);
        word-break: break-all;
      }
      .actions {
        display: flex;
        gap: var(--sp-2);
        align-items: center;
      }
      .actions button {
        font-size: 12px;
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        background: var(--bg-panel);
        cursor: pointer;
      }
      .actions button.resolve {
        color: var(--canopy-deep);
        border-color: var(--canopy);
      }
      .actions button.tb-toggle {
        color: var(--text-muted);
      }
      pre.traceback {
        display: none;
        font-size: 11.5px;
        background: #0d1512;
        color: #d7e0d9;
        padding: var(--sp-3);
        border-radius: var(--radius-sm);
        overflow-x: auto;
        margin-top: var(--sp-2);
      }
      #empty {
        text-align: center;
        color: var(--text-dim);
        padding: var(--sp-6);
      }
      #loadMore {
        display: block;
        margin: var(--sp-4) auto;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Errors <span class="badge">Vyom Engine — internal</span></h1>
      </div>
      <div id="unresolvedPill">— unresolved</div>
    </header>

    <main>
      <div class="toolbar">
        <select id="sourceFilter">
          <option value="">All sources</option>
        </select>
        <select id="platformFilter">
          <option value="">All platforms</option>
          <option value="S1">S1</option>
          <option value="S2">S2</option>
        </select>
        <button class="filter-btn active" data-resolved="unresolved">
          Unresolved
        </button>
        <button class="filter-btn" data-resolved="all">All</button>
        <button class="filter-btn" data-resolved="resolved">Resolved</button>
        <button class="filter-btn" id="refreshBtn">↻ Refresh</button>
      </div>

      <div id="list"></div>
      <div id="empty" style="display: none">No errors match this filter.</div>
      <button id="loadMore" class="filter-btn" style="display: none">
        Load more
      </button>
    </main>

    <script>
      // Adjust if the API isn't served from the same origin as this page.
      const API_BASE = window.location.origin;
      // Reuses the same session object the main dashboard writes on login
      // (SESSION_KEY = "vyom_session" -> {token, expires_at, username}).
      let token = null;
      try {
        const raw = localStorage.getItem("vyom_session");
        if (raw) token = JSON.parse(raw).token;
      } catch (e) {
        /* malformed/missing session -> stays unauthenticated */
      }

      let offset = 0;
      const LIMIT = 30;
      let resolvedMode = "unresolved"; // 'unresolved' | 'all' | 'resolved'

      function authHeaders() {
        return token ? { Authorization: "Bearer " + token } : {};
      }

      function qs(params) {
        const p = new URLSearchParams();
        Object.entries(params).forEach(([k, v]) => {
          if (v !== "" && v !== null && v !== undefined) p.set(k, v);
        });
        return p.toString();
      }

      async function loadSources() {
        const res = await fetch(`${API_BASE}/errors/sources`, {
          headers: authHeaders(),
        });
        if (!res.ok) return;
        const data = await res.json();
        const sel = document.getElementById("sourceFilter");
        data.sources.forEach((s) => {
          const opt = document.createElement("option");
          opt.value = s;
          opt.textContent = s;
          sel.appendChild(opt);
        });
      }

      function timeAgo(iso) {
        const diffMs = Date.now() - new Date(iso).getTime();
        const mins = Math.floor(diffMs / 60000);
        if (mins < 1) return "just now";
        if (mins < 60) return `${mins}m ago`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `${hrs}h ago`;
        return `${Math.floor(hrs / 24)}d ago`;
      }

      function escapeHtml(s) {
        return (s || "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function renderCard(item) {
        const div = document.createElement("div");
        div.className = "error-card" + (item.resolved ? " resolved" : "");
        const ctxStr = Object.keys(item.context || {}).length
          ? Object.entries(item.context)
              .map(([k, v]) => `${k}=${v}`)
              .join("  ·  ")
          : null;
        div.innerHTML = `
      <div class="error-top">
        <span class="source-tag">${escapeHtml(item.source)}</span>
        ${item.platform ? `<span class="source-tag platform-tag">${item.platform}</span>` : ""}
        <span class="source-tag level-${item.level}">${item.level}</span>
        <span class="time">${timeAgo(item.created_at)}</span>
      </div>
      <div class="message">${escapeHtml(item.message)}</div>
      ${ctxStr ? `<div class="context">${escapeHtml(ctxStr)}</div>` : ""}
      <div class="actions">
        ${
          item.resolved
            ? `<button class="unresolve">Mark unresolved</button>`
            : `<button class="resolve">Mark resolved</button>`
        }
        ${item.traceback ? `<button class="tb-toggle">Show traceback</button>` : ""}
      </div>
      ${item.traceback ? `<pre class="traceback">${escapeHtml(item.traceback)}</pre>` : ""}
    `;
        const resolveBtn = div.querySelector(".resolve");
        if (resolveBtn)
          resolveBtn.onclick = () => patchResolve(item.id, true, div);
        const unresolveBtn = div.querySelector(".unresolve");
        if (unresolveBtn)
          unresolveBtn.onclick = () => patchResolve(item.id, false, div);
        const tbToggle = div.querySelector(".tb-toggle");
        if (tbToggle)
          tbToggle.onclick = () => {
            const pre = div.querySelector(".traceback");
            const showing = pre.style.display === "block";
            pre.style.display = showing ? "none" : "block";
            tbToggle.textContent = showing
              ? "Show traceback"
              : "Hide traceback";
          };
        return div;
      }

      async function patchResolve(id, resolve, cardEl) {
        const res = await fetch(
          `${API_BASE}/errors/${id}/${resolve ? "resolve" : "unresolve"}`,
          {
            method: "PATCH",
            headers: authHeaders(),
          },
        );
        if (res.ok) {
          cardEl.remove();
          loadList(true); // refresh counts + pill
        }
      }

      async function loadList(reset = false) {
        if (reset) offset = 0;
        const params = {
          limit: LIMIT,
          offset,
          source: document.getElementById("sourceFilter").value,
          platform: document.getElementById("platformFilter").value,
        };
        if (resolvedMode === "unresolved") params.resolved = "false";
        if (resolvedMode === "resolved") params.resolved = "true";

        const res = await fetch(`${API_BASE}/errors?${qs(params)}`, {
          headers: authHeaders(),
        });
        if (!res.ok) {
          document.getElementById("list").innerHTML =
            `<div id="empty">Couldn't load errors (${res.status}). Check your session.</div>`;
          return;
        }
        const data = await res.json();
        document.getElementById("unresolvedPill").textContent =
          `${data.unresolved_count} unresolved`;

        const listEl = document.getElementById("list");
        if (reset) listEl.innerHTML = "";
        if (data.items.length === 0 && reset) {
          document.getElementById("empty").style.display = "block";
        } else {
          document.getElementById("empty").style.display = "none";
          data.items.forEach((item) => listEl.appendChild(renderCard(item)));
        }
        offset += data.items.length;
        document.getElementById("loadMore").style.display =
          offset < data.total ? "block" : "none";
      }

      document.querySelectorAll(".filter-btn[data-resolved]").forEach((btn) => {
        btn.onclick = () => {
          document
            .querySelectorAll(".filter-btn[data-resolved]")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          resolvedMode = btn.dataset.resolved;
          loadList(true);
        };
      });
      document.getElementById("sourceFilter").onchange = () => loadList(true);
      document.getElementById("platformFilter").onchange = () => loadList(true);
      document.getElementById("refreshBtn").onclick = () => loadList(true);
      document.getElementById("loadMore").onclick = () => loadList(false);

      loadSources();
      loadList(true);
    </script>
  </body>
</html>
